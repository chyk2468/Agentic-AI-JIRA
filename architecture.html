<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic-AI-JIRA Architecture</title><style>:root{--bg:#F1F4F8;--ink:#253447;--muted:#68788A;--line:#D6E0EA;--card:#FFFFFF;--a:#1868A8;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,56px);background:var(--bg);color:var(--ink)}main{max-width:1200px;margin:auto}.tag{color:var(--a);font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3rem)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:36px 0}.stage{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:200px;text-align:left;cursor:pointer;transition:transform .25s,border-color .25s}.stage:hover,.stage:focus-visible,.stage[aria-pressed=true]{transform:translateY(-5px);border-color:var(--a);outline:none}.stage h2{font-size:1.1rem}.stage p{font-size:.9rem}.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}</style></head><body><main><div class="tag">Interactive architecture</div><h1>Agentic-AI-JIRA</h1><p>Select a stage to inspect its role in the workflow.</p><section class="grid"><button class="stage" type="button" aria-pressed="true" data-i="0"><span class="tag">Stage 1 / REQUEST</span><h2>Natural language</h2><p>Describe the Jira task.</p></button><button class="stage" type="button" aria-pressed="false" data-i="1"><span class="tag">Stage 2 / CONTEXT</span><h2>ChromaDB retrieval</h2><p>Find related issue information.</p></button><button class="stage" type="button" aria-pressed="false" data-i="2"><span class="tag">Stage 3 / AGENT</span><h2>Plan action</h2><p>Resolve the action and required fields.</p></button><button class="stage" type="button" aria-pressed="false" data-i="3"><span class="tag">Stage 4 / JIRA CLOUD</span><h2>Execute + report</h2><p>Call Jira and return the result.</p></button></section><section class="detail" aria-live="polite"><h2 id="heading">Natural language</h2><p id="body">Describe the Jira task.</p></section><p><a href="https://github.com/chyk2468/Agentic-AI-JIRA" style="color:var(--a)">View repository</a></p></main><script>const stages=[["REQUEST","Natural language","Describe the Jira task."],["CONTEXT","ChromaDB retrieval","Find related issue information."],["AGENT","Plan action","Resolve the action and required fields."],["JIRA CLOUD","Execute + report","Call Jira and return the result."]];document.querySelectorAll('.stage').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.stage').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.querySelector('#heading').textContent=stages[+b.dataset.i][1];document.querySelector('#body').textContent=stages[+b.dataset.i][2]}))</script></body></html>
