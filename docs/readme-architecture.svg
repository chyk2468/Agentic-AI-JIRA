<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Jira AI Agent workflow</title><desc id="desc">The Streamlit app interprets a request, retrieves relevant issue context, prepares a Jira action, and sends it through the Jira client.</desc><rect width="1200" height="400" rx="18" fill="#F1F4F8"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#1868A8">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#253447">Jira AI Agent</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#68788A">Natural language to reviewed Jira actions</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D6E0EA"/><path d="M 300 237 L 330 237" stroke="#68788A" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#68788A" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#68788A" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#68788A" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#68788A" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#68788A" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6E0EA" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#1868A8"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#1868A8">01 / REQUEST</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#253447">Natural language</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#68788A">Describe an issue or task.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6E0EA" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#4A7D69"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4A7D69">02 / CONTEXT</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#253447">ChromaDB retrieval</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#68788A">Find related issue information.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6E0EA" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#B58646"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#B58646">03 / AGENT</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#253447">Plan an action</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#68788A">Resolve intent and parameters.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6E0EA" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#1868A8"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#1868A8">04 / JIRA CLOUD</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#253447">Execute and report</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#68788A">Call the Jira client and return status.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#1868A8">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#68788A">Review action details and scope before allowing changes to a live Jira project.</text></svg>